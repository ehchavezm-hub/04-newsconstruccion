name: Sondeo temporal de fuentes

on:
  workflow_dispatch:
  push:
    paths:
      - herramientas/sondeo.js

permissions:
  contents: read

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node herramientas/sondeo.js
